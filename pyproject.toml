[project]
name = "darling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "johnslavik", email = "bartosz@slawecki.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]",
    "httpx",
    "anthropic",
]

[project.scripts]
darling = "darling.__main__:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
