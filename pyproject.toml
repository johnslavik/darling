[project]
name = "darling"
version = "0.1.0"
description = "Personal workspace daemon MCP server — git worktrees + ZMX sessions + knowledge base"
readme = "README.md"
authors = [
    { name = "johnslavik", email = "bartosz@slawecki.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]",
    "httpx",
    "anthropic",
]

[project.scripts]
darling = "darling.__main__:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dead>=2.1.0",
    "mypy>=1.11",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.10",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
    "ARG",   # flake8-unused-arguments
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
