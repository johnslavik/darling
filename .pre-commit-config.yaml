repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: dead
        name: dead (unused code)
        entry: uv run dead
        args:
          - --files
          - "src/"
          - --tests
          - "(^|/)(tests?|testing|scenarios)/"
          - --symbol-allowlist
          - .dead_allowlist
        language: system
        pass_filenames: false

      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src/ tests/ --strict
        language: system
        pass_filenames: false
        stages: [pre-push]
